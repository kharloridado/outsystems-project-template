# Verify — the deterministic half of the loop's gate, re-run on every push.
#
# NEEDS NO SECRETS AND NO API KEY. The expensive judgment ("is this right?" — the
# render vs the frozen Figma ref) happens once, at build time, by the checker, and is
# frozen into each item's loop/refs/<id>/measurements.json. CI only asks the narrower
# question "did this change?", which is arithmetic.
#
# The browser is the Chrome already installed on the GitHub runner image, reached
# through playwright-core's `channel` — no browser download, no cache to warm.
name: verify

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # vendor/outsystems-ui is the real OutSystems UI base the preview stacks
          # under the theme. Without it every stylesheet 404s, the cascade falls
          # back, and the gate measures a page nobody will ever see.
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # The drift guard: no surviving <<PLACEHOLDER>>, no leaked example prefix,
      # conventions well-formed, .mcp.json's tenant agreeing with project.config.json.
      - name: check:config
        run: npm run check:config

      # Assembles dist/theme.css, then validates it: balanced braces, parses as real
      # CSS, and every var(--token) resolves. A dangling var() fails silently at
      # runtime and renders subtly wrong with no error anywhere.
      - name: build:theme
        run: npm run build:theme

      # Builds preview/vendor/outsystems-ui/outsystems-ui.css from the submodule.
      - name: build:osui
        run: npm run build:osui

      # Proves the harness itself works — browser launches, server serves, probes
      # read computed style — independently of any project state. When this passes
      # and the regression step fails, the fault is in the project, not the gate.
      - name: gate self-test
        run: npm run gate:selftest

      # Re-measures every committed probes.json and diffs against its committed
      # baseline. Computed strings diff exactly; geometry is compared with a
      # tolerance and reported as informational. No-ops until the first item lands.
      - name: fidelity regression
        run: npm run gate:regression

      - name: upload measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-output
          path: |
            loop/refs/**/measurements.json
            loop/refs/**/rendered*.png
          if-no-files-found: ignore
          retention-days: 14
