name: Deliverable (design-system component)
description: A component the loop should build. File it, put it in Backlog, and move it to Ready once it carries a requirement.
title: "[deliverable] <component>"
labels: ["deliverable"]
body:
  - type: markdown
    attributes:
      value: |
        This card is read by the design loop. It builds nothing from a card title alone —
        it needs **either a Figma node or a written spec**.

        Move the card to **Ready** only once one of the two below is filled in. A `Ready`
        card with neither goes straight to **Blocked**, on purpose: a component built from
        guesswork is the most expensive thing this loop can produce.

  - type: input
    id: component
    attributes:
      label: Component name
      description: The name as it appears in the design library (e.g. Button, Text Input, Card).
    validations: { required: true }

  - type: input
    id: figma_node
    attributes:
      label: Figma node
      description: >-
        Node id (1234-567) or a full Figma URL. It must belong to the library file key in
        project.config.json — a node from a forked or duplicated library looks identical in
        a screenshot and carries different values, so the loop blocks the card rather than
        building against the wrong file.

  - type: textarea
    id: spec
    attributes:
      label: Written spec (only if there is no Figma node)
      description: >-
        Values, states, sizes, behaviour. Treated as the spec of record, so be concrete:
        the checker measures the build against this. Needs at least a couple of paragraphs.
      placeholder: |
        Sizes: small 32px, medium 40px, large 48px
        States: default, hover, focus-visible, active, disabled
        Radius: 8px. Padding: 12px 16px.
        Behaviour: ...

  - type: checkboxes
    id: no_node_ack
    attributes:
      label: No Figma node
      options:
        - label: I confirm there is no Figma node and the written spec above is the spec of record.

  - type: checkboxes
    id: in_scope
    attributes:
      label: Scope
      description: >-
        The loop refuses to build speculatively. On the project this template came from, an
        entire component set was designed, coded and thrown away because nobody with
        authority over scope had confirmed the list. This checkbox is that confirmation.
      options:
        - label: This deliverable is in the agreed scope for this engagement.
          required: true

  - type: dropdown
    id: tier
    attributes:
      label: Tier
      description: Position in the dependency graph, and therefore build order.
      options: [foundations, primitives, composites, patterns]

  - type: input
    id: depends_on
    attributes:
      label: Depends on
      description: >-
        Issue numbers that must be merged to main before this can be built, e.g. "#12, #14".
        A composite is never built before the primitives it contains. Leave blank if none.

  - type: textarea
    id: notes
    attributes:
      label: Notes for the build
      description: Anything else the maker should know. Comments added later are read as spec updates too.
